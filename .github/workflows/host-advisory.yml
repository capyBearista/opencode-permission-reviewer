name: host compatibility advisory

on:
  workflow_dispatch:
  schedule:
    - cron: "19 8 * * 1"

permissions:
  contents: read

jobs:
  newer-hosts:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.3.5"
      - name: Report releases outside the verified matrix
        run: bun tests/compatibility/host-advisory.ts
